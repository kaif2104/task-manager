<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A calm, focused task manager for your everyday work.">
  <title>Daylist — Focus on what matters</title>
  <style>
    :root{--ink:#172033;--muted:#758096;--line:#e6eaf0;--paper:#fff;--wash:#f7f8fb;--blue:#4169e1;--blue-dark:#3153bd;--green:#23855b;--red:#d45656;--shadow:0 18px 55px rgba(36,47,79,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
    aside{background:#202a46;color:#dfe5fa;padding:30px 20px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;color:#fff;font-size:20px;font-weight:750;letter-spacing:-.03em;margin:0 10px 46px}.mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#6685f2;color:#fff;font-size:18px}
    nav{display:grid;gap:6px}.nav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;border-radius:10px;color:#b9c3e3;background:transparent;text-align:left}.nav-item.active,.nav-item:hover{background:#303c60;color:#fff}.nav-icon{width:20px;text-align:center;font-size:17px}.side-note{margin-top:auto;padding:17px 14px;border:1px solid #354264;border-radius:12px;color:#aeb8d7;font-size:12px}.side-note strong{display:block;color:#eaf0ff;font-size:13px;margin-bottom:5px}
    main{max-width:1060px;width:100%;margin:0 auto;padding:42px 48px}.topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:30px}.eyebrow{margin:0 0 4px;color:var(--blue);font-size:12px;font-weight:750;letter-spacing:.1em;text-transform:uppercase}.topbar h1{margin:0;font-size:32px;letter-spacing:-.045em}.today{margin:8px 0 0;color:var(--muted)}.date-chip{background:#eef2ff;border-radius:10px;color:var(--blue-dark);font-size:13px;font-weight:650;padding:9px 13px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:17px 19px;box-shadow:var(--shadow)}.stat-label{color:var(--muted);font-size:12px}.stat-value{display:block;font-size:25px;font-weight:750;letter-spacing:-.04em;margin-top:2px}.progress{height:5px;background:#edf0f5;border-radius:5px;margin-top:11px;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue);border-radius:5px;transition:width .25s}
    .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.composer{padding:19px;margin-bottom:18px}.compose-row{display:flex;gap:10px}.compose-row input{flex:1;border:0;outline:0;font-size:17px;color:var(--ink)}.compose-row input::placeholder{color:#aab2c1}.primary{border:0;border-radius:9px;background:var(--blue);color:white;font-weight:700;padding:10px 18px}.primary:hover{background:var(--blue-dark)}.compose-options{display:flex;gap:9px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.compose-options select,.compose-options input{border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--muted);background:#fff;font-size:13px}
    .toolbar{display:flex;justify-content:space-between;align-items:center;margin:24px 0 13px}.tabs{display:flex;gap:5px}.tab{border:0;background:transparent;color:var(--muted);padding:7px 11px;border-radius:8px;font-weight:650}.tab.active,.tab:hover{background:#e9edff;color:var(--blue-dark)}.search{width:200px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 11px;outline:0}.search:focus,.compose-options input:focus,.compose-options select:focus{border-color:#91a5ef}
    #list{display:grid;gap:10px}.task{display:flex;align-items:flex-start;gap:13px;padding:17px 18px}.task-check{appearance:none;width:20px;height:20px;border:1.5px solid #b9c1d1;border-radius:50%;margin:2px 0 0;flex:0 0 auto}.task-check:checked{border-color:var(--green);background:var(--green);box-shadow:inset 0 0 0 4px #fff}.task-main{min-width:0;flex:1}.task-title{font-weight:650;word-break:break-word}.task.done .task-title{text-decoration:line-through;color:#9ba3b1}.task-notes{color:var(--muted);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-meta{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:11px;color:var(--muted)}.priority{border-radius:20px;padding:2px 7px;font-weight:700;text-transform:capitalize}.priority-high{background:#fff0f0;color:var(--red)}.priority-medium{background:#fff7e6;color:#ad7615}.priority-low{background:#edf8f2;color:var(--green)}.overdue{color:var(--red);font-weight:700}.task-actions{display:flex;gap:3px;opacity:0;transition:opacity .15s}.task:hover .task-actions,.task:focus-within .task-actions{opacity:1}.icon-btn{border:0;background:transparent;color:#9aa3b4;border-radius:7px;padding:6px}.icon-btn:hover{background:#f0f2f6;color:var(--ink)}.empty{text-align:center;padding:58px 20px;color:var(--muted)}.empty-icon{font-size:32px;margin-bottom:7px}.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}.toast{position:fixed;right:24px;bottom:24px;background:#202a46;color:white;border-radius:9px;padding:11px 15px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}
    @media(max-width:720px){.shell{display:block}aside{padding:16px 18px;display:block}.brand{margin:0 0 15px}.side-note{display:none}nav{display:flex;overflow:auto}.nav-item{white-space:nowrap;padding:8px 10px}.nav-item span:last-child{display:none}main{padding:27px 16px}.topbar{margin-bottom:23px}.topbar h1{font-size:27px}.date-chip{display:none}.stats{gap:8px}.stat{padding:13px 11px}.stat-value{font-size:21px}.stat-label{font-size:11px}.toolbar{gap:9px;align-items:stretch;flex-direction:column}.search{width:100%}.task-actions{opacity:1}}
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand"><span class="mark">✓</span> Daylist</div>
      <nav aria-label="Task views">
        <button class="nav-item active" type="button"><span class="nav-icon">◷</span><span>My tasks</span></button>
        <button class="nav-item" type="button" id="focusNav"><span class="nav-icon">✦</span><span>Focus today</span></button>
      </nav>
      <div class="side-note"><strong>Small steps, every day.</strong>Keep your list clear and make space for great work.</div>
    </aside>
    <main>
      <header class="topbar"><div><p class="eyebrow">Your workspace</p><h1>Good morning</h1><p class="today" id="date"></p></div><span class="date-chip" id="dateChip"></span></header>
      <section class="stats" aria-label="Task summary">
        <div class="stat"><span class="stat-label">Open tasks</span><strong class="stat-value" id="openCount">0</strong></div>
        <div class="stat"><span class="stat-label">Completed</span><strong class="stat-value" id="doneCount">0</strong></div>
        <div class="stat"><span class="stat-label">Your progress</span><strong class="stat-value" id="progressText">0%</strong><div class="progress"><i id="progressBar"></i></div></div>
      </section>
      <form class="card composer" id="form">
        <div class="compose-row"><input id="title" maxlength="160" autocomplete="off" placeholder="What needs to get done?" required><button class="primary" type="submit">Add task</button></div>
        <div class="compose-options"><select id="priority" aria-label="Priority"><option value="medium">Medium priority</option><option value="high">High priority</option><option value="low">Low priority</option></select><input id="dueDate" type="date" aria-label="Due date"><input id="notes" maxlength="500" placeholder="Add a note (optional)" aria-label="Notes"></div>
      </form>
      <div class="toolbar"><div class="tabs" role="tablist"><button class="tab active" data-filter="all" type="button">All</button><button class="tab" data-filter="open" type="button">Open</button><button class="tab" data-filter="done" type="button">Completed</button></div><input class="search" id="search" type="search" placeholder="Search tasks..." aria-label="Search tasks"></div>
      <section id="list" aria-live="polite"></section>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const state={tasks:[],filter:'all',search:''};const $=id=>document.getElementById(id);
    const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const formatDate=value=>value?new Date(`${value}T00:00:00`).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'';
    const isOverdue=t=>t.due_date&&!t.done&&new Date(`${t.due_date}T23:59:59`)<new Date();
    function toast(message){$('toast').textContent=message;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2400)}
    function render(){const query=state.search.toLowerCase();const visible=state.tasks.filter(t=>(state.filter==='all'||(state.filter==='open'&&!t.done)||(state.filter==='done'&&t.done))&&(!query||`${t.title} ${t.notes}`.toLowerCase().includes(query)));$('openCount').textContent=state.tasks.filter(t=>!t.done).length;$('doneCount').textContent=state.tasks.filter(t=>t.done).length;const total=state.tasks.length;const percent=total?Math.round(state.tasks.filter(t=>t.done).length/total*100):0;$('progressText').textContent=`${percent}%`;$('progressBar').style.width=`${percent}%`;if(!visible.length){$('list').innerHTML=`<div class="card empty"><div class="empty-icon">${state.tasks.length?'⌕':'✦'}</div><strong>${state.tasks.length?'No matching tasks':'Your list is clear'}</strong><span>${state.tasks.length?'Try another filter or search.':'Add your first task above and get started.'}</span></div>`;return}
      $('list').innerHTML=visible.map(t=>`<article class="card task ${t.done?'done':''}" data-id="${t.id}"><input class="task-check" type="checkbox" ${t.done?'checked':''} aria-label="Mark ${escapeHtml(t.title)} complete"><div class="task-main"><div class="task-title">${escapeHtml(t.title)}</div>${t.notes?`<div class="task-notes">${escapeHtml(t.notes)}</div>`:''}<div class="task-meta"><span class="priority priority-${t.priority}">${t.priority}</span>${t.due_date?`<span class="${isOverdue(t)?'overdue':''}">${isOverdue(t)?'Overdue · ':''}${formatDate(t.due_date)}</span>`:''}</div></div><div class="task-actions"><button class="icon-btn edit" type="button" aria-label="Edit task">✎</button><button class="icon-btn delete" type="button" aria-label="Delete task">×</button></div></article>`).join('')}
    async function request(url,options){const response=await fetch(url,options);if(!response.ok){const body=await response.json().catch(()=>({}));throw new Error(body.error||'Something went wrong');}return response.status===204?null:response.json()}
    async function load(){try{state.tasks=await request('/api/todos');render()}catch(error){$('list').innerHTML='<div class="card empty"><strong>Could not load your tasks</strong><span>Check your connection and refresh the page.</span></div>';toast(error.message)}}
    $('form').addEventListener('submit',async event=>{event.preventDefault();const button=event.target.querySelector('button');button.disabled=true;try{await request('/api/todos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:$('title').value,notes:$('notes').value,priority:$('priority').value,due_date:$('dueDate').value||null})});event.target.reset();toast('Task added');await load()}catch(error){toast(error.message)}finally{button.disabled=false}});
    document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{document.querySelector('.tab.active').classList.remove('active');button.classList.add('active');state.filter=button.dataset.filter;render()}));$('search').addEventListener('input',event=>{state.search=event.target.value;render()});$('focusNav').addEventListener('click',()=>{$('dueDate').value=new Date().toISOString().slice(0,10);$('title').focus()});
    $('list').addEventListener('click',async event=>{const task=event.target.closest('.task');if(!task)return;const id=task.dataset.id;const current=state.tasks.find(t=>String(t.id)===id);try{if(event.target.classList.contains('task-check')){await request(`/api/todos/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({done:event.target.checked})});await load()}else if(event.target.classList.contains('delete')){if(confirm('Delete this task?')){await request(`/api/todos/${id}`,{method:'DELETE'});toast('Task deleted');await load()}}else if(event.target.classList.contains('edit')){const title=prompt('Update task title',current.title);if(title&&title.trim()!==current.title){await request(`/api/todos/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title.trim()})});await load()}}}catch(error){toast(error.message)}});
    const today=new Date();$('date').textContent=today.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});$('dateChip').textContent=today.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});load();
  </script>
</body>
</html>
